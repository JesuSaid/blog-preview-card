<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="style.css">
  <title>Blog preview card</title>
</head>
<body>
  <main>
    <article class="card">
      <img class="card-illustration" src="./assets/images/illustration-article.svg" alt="">
      <p class="card-category">Learning</p>
      <p class="card-date">Published <time datetime="2023-12-21">21 Dec 2023</time></p>
      <h1 class="card-title"><a href="#">HTML & CSS foundations</a></h1>
      <p class="card-description">These languages are the backbone of every website, defining structure, content, and presentation.</p>
      <footer>
        <img class="avatar" src="./assets/images/image-avatar.webp" alt="">
        <p class="card-autor">Greg Hooper</p>
      </footer>
    </article>
  </main>
</body>
</html>
